spring:
  datasource:
    url: jdbc:h2:mem:aikb;DB_CLOSE_DELAY=-1;MODE=MySQL;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:ai-knowledge-base-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-ttl: 900000
  refresh-ttl: 604800000

server:
  port: 8080
